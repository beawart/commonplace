<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Book Learning Vault</title><style>
:root{--bg:#f5f3ee;--card:#fffdf9;--glass:#ffffffcc;--txt:#25282d;--muted:#747b83;--accent:#718c79;--accent2:#c8a98c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top left,#dce9df,var(--bg));color:var(--txt)}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:var(--glass);backdrop-filter:blur(16px);border-radius:24px;padding:24px;border:1px solid rgba(255,255,255,.1)}h1{margin:0;font-size:2rem}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{background:var(--card);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,.08)}textarea,input{width:100%;background:var(--card);color:var(--txt);border:1px solid #ded8cf;border-radius:12px;padding:12px}.list{display:grid;gap:10px;margin-top:12px}.note{padding:12px;border-radius:12px;background:#f7f4ee}.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));font-size:.75rem}.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:white;padding:12px 18px;border-radius:12px;font-weight:700}.quote{font-style:italic;border-left:3px solid var(--accent);padding-left:12px}.ref{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#1f2937;padding:8px 12px;border-radius:999px}.sticky{position:sticky;top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:1.5rem}}.tiny{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px}.dark{--bg:#15181d;--card:#20242a;--glass:#20242acc;--txt:#f2f3f5;--muted:#a7afb9;--accent:#9fbea7;--accent2:#8e789e}.dark .note{background:#272c33}.dark input,.dark textarea{background:#272c33;color:#f2f3f5;border-color:#3a4049}</style></head><body><div class='wrap'><div class='hero'><h1>📚 Commonplace <button id='theme' class='btn' style='float:right'>🌙</button></h1><p>A cozy personal library of ideas worth remembering.</p></div><div class='grid'><div><div class='card'><h3>Books</h3><div style='display:flex;gap:8px'><input id='book' placeholder='Add a book'><button class='btn' onclick='addBook()'>+</button></div><div id='books' class='list'></div></div><div class='card'><h3 id='selectedTitle'>💡 Select a book</h3><textarea id='learning' rows='3' placeholder='One learning...'></textarea><br><button class='btn' onclick='addLearning()'>Save Idea</button><div id='learnList' class='list'></div></div></div><div class='sticky'><div class='card'><h3>🔎 Search</h3><input id='search' placeholder='Find a book or thought...' oninput='render()'><br><br><button class='btn' onclick='surprise()'>🎲 Surprise me</button><p class='quote' id='qview'>A random saved idea will appear here.</p></div><div class='card'><h3>⭐ Favorites</h3><div id='favorites' class='list'></div></div></div></div></div><script>
let B=JSON.parse(localStorage.getItem('cp-books')||'[]'),I=JSON.parse(localStorage.getItem('cp-ideas')||'[]'),sel=B[0]?.id||null;
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),save=()=>{localStorage.setItem('cp-books',JSON.stringify(B));localStorage.setItem('cp-ideas',JSON.stringify(I))};
function addBook(){let n=book.value.trim();if(!n)return;let b={id:id(),name:n};B.push(b);sel=b.id;book.value='';save();render()}
function pick(x){sel=x;render()}
function rename(x){let b=B.find(v=>v.id===x),n=prompt('Rename book',b.name);if(n?.trim()){b.name=n.trim();save();render()}}
function delBook(x){if(confirm('Delete this book and its ideas?')){B=B.filter(v=>v.id!==x);I=I.filter(v=>v.book!==x);sel=B[0]?.id||null;save();render()}}
function addLearning(){let t=learning.value.trim();if(!t||!sel)return;I.unshift({id:id(),book:sel,text:t,fav:false});learning.value='';save();render()}
function editIdea(x){let i=I.find(v=>v.id===x),t=prompt('Edit idea',i.text);if(t?.trim()){i.text=t.trim();save();render()}}
function delIdea(x){if(confirm('Delete this idea?')){I=I.filter(v=>v.id!==x);save();render()}}
function fav(x){let i=I.find(v=>v.id===x);i.fav=!i.fav;save();render()}
function surprise(){if(!I.length)return;let i=I[Math.floor(Math.random()*I.length)],b=B.find(v=>v.id===i.book);qview.textContent='“'+i.text+'” — '+(b?.name||'Book')}
function render(){let q=(search?.value||'').toLowerCase(),b=B.find(v=>v.id===sel);selectedTitle.textContent='💡 '+(b?.name||'Select a book');books.innerHTML=B.map(v=>`<div class='note' onclick="pick('${v.id}')" style='cursor:pointer;border-left:4px solid ${v.id===sel?'#718c79':'transparent'}'>📖 ${v.name}<span style='float:right'><button class='tiny' onclick="event.stopPropagation();rename('${v.id}')">✎</button><button class='tiny' onclick="event.stopPropagation();delBook('${v.id}')">×</button></span></div>`).join('');let list=I.filter(v=>q?((v.text+' '+(B.find(b=>b.id===v.book)?.name||'')).toLowerCase().includes(q)):v.book===sel);learnList.innerHTML=list.map(v=>`<div class='note'><span class='tag'>${B.find(b=>b.id===v.book)?.name||'Book'}</span><p>${v.text}</p><button class='tiny' onclick="fav('${v.id}')">${v.fav?'★':'☆'}</button><button class='tiny' onclick="editIdea('${v.id}')">✎</button><button class='tiny' onclick="delIdea('${v.id}')">×</button></div>`).join('')||'<p style="color:var(--muted)">No ideas yet.</p>';favorites.innerHTML=I.filter(v=>v.fav).map(v=>`<div class='note'>★ ${v.text}</div>`).join('')||'<small>No favorites yet.</small>'}
theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('cp-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('cp-dark')==='true')document.body.classList.add('dark');render();
</script></body></html>
